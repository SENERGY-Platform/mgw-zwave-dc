name: 'zwavejs2mqtt Docker Image'

# the zwavejs2mqtt image has its own version line, released with tags like zwavejs2mqtt/v1.3.2
# the image is tagged without the prefix, plain v* tags release mgw-zwave-dc (see tag.yml)
on:
  push:
    tags:
      - 'zwavejs2mqtt/v[0-9]+.[0-9]+.[0-9]+'

jobs:
  multi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Image version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#zwavejs2mqtt/}" >> "$GITHUB_OUTPUT"
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: ./zwavejs2mqtt
          file: ./zwavejs2mqtt/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            smartenergyplatform/zwavejs2mqtt:latest
            smartenergyplatform/zwavejs2mqtt:${{ steps.version.outputs.tag }}
            ghcr.io/senergy-platform/zwavejs2mqtt:latest
            ghcr.io/senergy-platform/zwavejs2mqtt:${{ steps.version.outputs.tag }}
