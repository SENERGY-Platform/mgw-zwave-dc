name: 'zwavejs2mqtt Docker Image'

# the zwavejs2mqtt image has its own version line, released with tags like zwavejs2mqtt/v1.3.2
# the image is tagged without the prefix, plain v* tags release mgw-zwave-dc (see tag.yml)
on:
  push:
    tags:
      - 'zwavejs2mqtt/v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Image version
        id: version
        run: echo "tag=${GITHUB_REF_NAME#zwavejs2mqtt/}" >> "$GITHUB_OUTPUT"

  # Builds each platform on a native runner of its own, arm64 without QEMU, and merges
  # both into one manifest under every tag below.
  multi:
    needs: version
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      context: ./zwavejs2mqtt
      meta-images: |
        smartenergyplatform/zwavejs2mqtt
        ghcr.io/senergy-platform/zwavejs2mqtt
      meta-tags: |
        type=raw,value=latest
        type=raw,value=${{ needs.version.outputs.tag }}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
